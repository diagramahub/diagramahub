# DiagramaHub frontend — static serving (SPA).
# Replaces the image's default.conf. Nginx listens on 5173 (a high port,
# allowed for the non-root base image) so existing host port mappings and
# managed-platform configurations keep working unchanged.

# On-the-fly compression for text assets. Conf.d files are included in the
# http context, so gzip directives are valid here.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen       5173;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers at server level. Locations below use `expires` instead
    # of their own add_header, so these headers are never dropped (an
    # add_header in a location overrides the server-level ones in nginx).
    include /etc/nginx/conf.d/headers.conf;

    # The SPA entry point must always be revalidated so new releases are
    # picked up immediately. `expires -1` sets Cache-Control: no-cache.
    location = /index.html {
        expires -1;
    }

    # Runtime configuration (regenerated at container start). Never cached.
    location = /config.js {
        expires -1;
    }

    # Hashed build assets are immutable: cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React Router: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
