# Headers for /embed/<token> (see nginx.conf). Same as headers.conf except
# that it allows framing: no X-Frame-Options, and the CSP's frame-ancestors
# comes from CSP_EMBED_FRAME_ANCESTORS (default '*').
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
include /etc/nginx/csp/csp-embed.conf;
