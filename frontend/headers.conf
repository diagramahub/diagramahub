# Security headers for the DiagramaHub frontend, included at server level in
# nginx.conf. Mirrors the headers the backend API sends (minus the deny-all
# CSP, which only makes sense for JSON responses).
#
# HSTS is intentionally absent: the container serves plain HTTP behind an
# edge reverse proxy, which is where TLS and the Strict-Transport-Security
# header belong.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy is deliberately not enabled by default: a policy
# that is too strict breaks the editor (Mermaid inline styles, Monaco
# workers) and one that is too loose protects nothing. See csp.conf.example
# for a tested starting point and enable it per deployment after validating
# the app under it.
