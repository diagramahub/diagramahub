# Security headers for the DiagramaHub frontend, included at server level in
# nginx.conf. Mirrors the headers the backend API sends (minus the deny-all
# CSP, which only makes sense for JSON responses).
#
# HSTS is intentionally absent: the container serves plain HTTP behind an
# edge reverse proxy, which is where TLS and the Strict-Transport-Security
# header belong.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy: generated at container start by
# entrypoint-config.sh (connect-src follows VITE_API_URL and the Sentry DSN).
# Set CSP_ENABLED=false to turn it off.
include /etc/nginx/csp/csp.conf;
