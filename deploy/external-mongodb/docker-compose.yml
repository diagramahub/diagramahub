# DiagramHub - External MongoDB Installation
# This configuration uses an external MongoDB instance (Atlas, custom server, etc.)
# Only Backend and Frontend are deployed locally

services:
  kroki:
    image: yuzutech/kroki
    container_name: diagramahub-kroki
    restart: unless-stopped
    networks:
      - diagramahub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagramahub-backend
    restart: unless-stopped
    ports:
      - "5172:5172"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/run-tests.sh:/app/run-tests.sh
    env_file:
      - ./backend/.env
    depends_on:
      - kroki
    networks:
      - diagramahub-network
    # No `command:` override on purpose. The image's CMD runs ./start.sh, which
    # picks gunicorn with WORKERS (default 2) when APP_ENV is production. An
    # override running `uvicorn --reload` here used to ship the development
    # server in the scenario meant for production deployments.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diagramahub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_URL=http://localhost:5172
    networks:
      - diagramahub-network
    depends_on:
      - backend

networks:
  diagramahub-network:
    driver: bridge
