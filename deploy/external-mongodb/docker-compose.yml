# DiagramHub - External MongoDB Installation
# This configuration uses an external MongoDB instance (Atlas, custom server, etc.)
# Only Backend and Frontend are deployed locally

services:
  kroki:
    image: yuzutech/kroki
    container_name: diagramahub-kroki
    restart: unless-stopped
    networks:
      - diagramahub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagramahub-backend
    restart: unless-stopped
    ports:
      - "5172:5172"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/run-tests.sh:/app/run-tests.sh
    env_file:
      - ./backend/.env
    depends_on:
      - kroki
    networks:
      - diagramahub-network
    # No `command:` override on purpose. The image's CMD runs ./start.sh, which
    # picks gunicorn with WORKERS (default 2) when APP_ENV is production. An
    # override running `uvicorn --reload` here used to ship the development
    # server in the scenario meant for production deployments.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: diagramahub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Runtime configuration: written to /config.js when the container
      # starts and read by the SPA. No rebuild needed when these change —
      # just recreate the container. Values come from the shell or a
      # compose-level .env file next to this compose file.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5172}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
    networks:
      - diagramahub-network
    depends_on:
      - backend

networks:
  diagramahub-network:
    driver: bridge
