# DiagramHub - Local Full Installation
# This configuration includes all services: MongoDB, Backend, and Frontend
# Use this for local development or self-hosted installations

services:
  mongodb:
    image: mongo:8.0
    container_name: diagramahub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: diagramahub
    networks:
      - diagramahub-network

  kroki:
    image: yuzutech/kroki:0.36.0
    container_name: diagramahub-kroki
    restart: unless-stopped
    networks:
      - diagramahub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_ENV: development
    container_name: diagramahub-backend
    restart: unless-stopped
    ports:
      - "5172:5172"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/run-tests.sh:/app/run-tests.sh
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - PORT=5172
    depends_on:
      - mongodb
      - kroki
    networks:
      - diagramahub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: diagramahub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # The whole folder: a folder mount follows `git checkout`, while
      # single-file mounts kept serving the replaced files, and the lint and
      # test configs are included. node_modules stays the image's own (built
      # for Linux); after a dependency change run
      # `docker-compose up -d --build -V frontend` to refresh it.
      - ./frontend:/app
      - /app/node_modules
      # Vitest checks the AI model catalog and the Mermaid reference against
      # the backend's copies (read-only).
      - ./backend/app/api/v1/ai_providers:/backend/app/api/v1/ai_providers:ro
    environment:
      - VITE_API_URL=http://localhost:5172
    networks:
      - diagramahub-network
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local

networks:
  diagramahub-network:
    driver: bridge
