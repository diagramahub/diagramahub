# Builds the MkDocs Material documentation and publishes it to GitHub Pages.
#
# The site is served from the /diagramahub/ subpath:
#   https://diagramahub.github.io/diagramahub/
#
# Required repository configuration (Settings → Pages):
#   Source: "GitHub Actions"
# Without it the deploy step fails with "Get Pages site failed. Not Found".
# The Pages source used to be "Deploy from a branch: main /docs", which made
# Jekyll render the raw Markdown with the default theme (no navigation, no
# search, no theme) instead of this MkDocs site.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      # --strict turns every MkDocs warning (broken links, pages missing from
      # the nav, ...) into a build failure, so the published site never ships
      # with a broken link.
      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload built site (pull request preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
