[pytest]
# This file is optional as configuration is in pyproject.toml
# Kept for compatibility with tools that look for pytest.ini

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    property: Property-based tests
