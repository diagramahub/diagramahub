[tool.poetry]
name = "diagramahub-backend"
version = "0.9.1"
description = "Diagramahub backend API with FastAPI and MongoDB"
authors = ["Diagramahub Team"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.163.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
uvicorn-worker = "^0.4.0"
beanie = "^2.2.0"
pymongo = "^4.20.0"
pydantic = "^2.14.3"
pydantic-settings = "^2.16.3"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
bcrypt = "^5.0.0"
python-multipart = "^0.0.33"
email-validator = "^2.4.0"
google-genai = "^3.3.0"
cryptography = "^50.0.0"
httpx = "^0.28.1"
stripe = "^11.0.0"
gunicorn = "^27.0.1"
resend = {version = "^2.53.2", extras = ["async"]}
pyotp = "^2.11.2"
qrcode = {extras = ["pil"], version = "^8.2"}
openpyxl = "^3.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.75.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
pytest-cov = "^7.1.0"
faker = "^40.54.0"
black = "^26.10.1"
ruff = "^0.17.5"
mypy = "^2.4.1"
hypothesis = "^6.170.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Pinned to the rule set used before ruff 0.16 (which enabled 413 rules by default).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# One event loop for the whole run, as the session-scoped `event_loop` fixture
# did before pytest-asyncio 1.0 removed it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "property: Property-based tests",
]
