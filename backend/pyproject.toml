[tool.poetry]
name = "diagramahub-backend"
version = "0.5.6"
description = "Diagramahub backend API with FastAPI and MongoDB"
authors = ["Diagramahub Team"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.115.0,<0.129.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
beanie = "^1.27.0"
motor = "^3.6.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1"
python-multipart = "^0.0.18"
email-validator = "^2.2.0"
google-genai = "^1.0.0"
cryptography = "^43.0.0"
httpx = "^0.27.0"
stripe = "^11.0.0"
gunicorn = "^22.0.0"
resend = {version = "^2.0.0", extras = ["async"]}
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^7.4"}
openpyxl = "^3.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
faker = "^33.0.0"
black = "^24.10.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
hypothesis = "^6.100.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_fixture_scope_function = true
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "property: Property-based tests",
]
