          - Proyectos y carpetas: es/guia/organizacion.md
          - Exportar e importar: es/guia/exportar-importar.md
          - Compartir diagramas: es/guia/compartir.md
          - Modo presentación: es/guia/presentacion.md
          - Asistente de IA: es/guia/ia.md
          - Tu cuenta y seguridad: es/guia/cuenta.md
      - Self-host:
          - es/self-host/index.md
          - Instalación: es/instalacion.md
          - Configuración: es/self-host/configuracion.md
          - Producción: es/self-host/produccion.md
          - Integraciones: es/self-host/integraciones.md
          - Planes y límites: es/self-host/planes.md
          - Mantenimiento y actualización: es/self-host/mantenimiento.md
