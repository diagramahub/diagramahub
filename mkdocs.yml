site_name: Documentación de DiagramaHub
site_description: Documentación oficial de DiagramaHub
site_author: DiagramaHub Team

# GitHub Pages sirve el sitio en un subdirectorio (https://diagramahub.github.io/diagramahub/).
# Sin `site_url`, MkDocs no puede generar la URL canónica ni los enlaces alternos de idioma.
site_url: https://diagramahub.github.io/diagramahub/
repo_url: https://github.com/diagramahub/diagramahub
repo_name: diagramahub/diagramahub
edit_uri: edit/main/docs/
copyright: Copyright &copy; DiagramaHub — Apache License 2.0

# Páginas que se construyen pero no aparecen en la navegación: la portada se
# alcanza desde el logo (site_url), y así no añade una pestaña extra.
not_in_nav: |
  /index.md

theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs # Pestañas en la navegación (una por idioma)
    - navigation.sections # Agrupa las secciones en la barra lateral
    - navigation.indexes # Hace clickeables las secciones
    - navigation.path # Migas de pan sobre el título
    - toc.follow # El índice de la página sigue el scroll
    - navigation.top # Botón de "volver arriba"
    - navigation.footer # Enlaces anterior/siguiente al pie
    - content.code.copy # Botón para copiar código
    - content.code.annotate # Anotaciones numeradas dentro del código
    - content.tabs.link # Pestañas de contenido sincronizadas (p. ej. macOS / Linux)
    - content.action.edit # Botón "editar esta página" en GitHub
    - search.suggest # Sugerencias de búsqueda
    - search.highlight # Resalta el término buscado

  # Configuración del modo Claro/Oscuro dinámico
  palette:
    # Modo Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo Oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

# Selector de idiomas. Las URLs son absolutas a propósito: el sitio vive bajo
# /diagramahub/, así que un enlace como "/es/" apuntaría fuera del subdirectorio.
extra:
  alternate:
    - name: Español
      link: https://diagramahub.github.io/diagramahub/es/
      lang: es
    - name: English
      link: https://diagramahub.github.io/diagramahub/en/
      lang: en

# Configuración de los menús.
# Cada idioma es una pestaña; dentro, las secciones se muestran agrupadas en la
# barra lateral (navigation.sections). Las notas de versión se agrupan por
# versión menor: `scripts/check-version.sh` busca la línea `- <V>: <lang>/release-notes/<V>.md`
# sin importar la indentación.
nav:
  - Español:
      - Inicio: es/index.md
      - Preguntas frecuentes: es/faq.md
      - Guía de uso:
          - es/guia/index.md
          - Primeros pasos: es/guia/primeros-pasos.md
          - El editor: es/guia/editor.md
          - Tipos de diagrama: es/guia/tipos-de-diagrama.md
